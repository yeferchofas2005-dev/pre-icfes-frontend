<div class="login-container">
  <div class="login-card">
    <img src="assets/icon/logo.png" alt="Logo Preicfes" class="login-logo">

    <h1>Iniciar sesión</h1>
    <p class="login-subtitle">Bienvenido de nuevo</p>

    <div *ngIf="errorMessage" class="alert-error">
      {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="input-group">
        <label for="email">Correo electrónico</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          placeholder="correo@ejemplo.com"
          [class.input-error]="getFieldError('email')"
        >
        <span class="error-text" *ngIf="getFieldError('email')">
          {{ getFieldError('email') }}
        </span>
      </div>

      <div class="input-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          placeholder="••••••••"
          [class.input-error]="getFieldError('password')"
        >
        <span class="error-text" *ngIf="getFieldError('password')">
          {{ getFieldError('password') }}
        </span>
      </div>

      <button type="submit" class="btn-login" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting">Iniciar sesión</span>
        <span *ngIf="isSubmitting" class="spinner"></span>
      </button>
    </form>

    <div class="demo-section">
      <p class="demo-title">Accesos rápidos de prueba:</p>
      <div class="demo-buttons">
        <button type="button" class="btn-demo btn-demo-estudiante" (click)="setDemoCredentials('estudiante')">
          Estudiante
        </button>
        <button type="button" class="btn-demo btn-demo-docente" (click)="setDemoCredentials('docente')">
          Docente
        </button>
        <button type="button" class="btn-demo btn-demo-admin" (click)="setDemoCredentials('admin')">
          Administrador
        </button>
      </div>
    </div>

    <p class="register-text">
      ¿No tienes cuenta?
      <a routerLink="/inscripcion">Regístrate aquí</a>
    </p>
  </div>
</div>
