<!-- Botón Burbuja Flotante -->
<button class="chatbot-bubble" (click)="toggleWidget()" aria-label="Abrir Chatbot">
  <span class="bubble-icon">💬</span>
</button>

<!-- Contenedor del Widget Flotante -->
<div class="widget-window" [class.widget-hidden]="!isOpen">
  <!-- Cabecera del Widget -->
  <div class="widget-header">
    <div class="widget-brand">🎓 VocaPath IA</div>
    <button class="widget-close" (click)="toggleWidget()" aria-label="Cerrar">✖</button>
  </div>
  
  <div class="widget-body">
    <!-- El Iframe carga el chatbot original -->
    <iframe *ngIf="isLoaded" src="http://localhost:8000" frameborder="0" title="Chatbot Vocacional"></iframe>
  </div>
</div>
